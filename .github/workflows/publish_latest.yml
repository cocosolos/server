name: publish_latest

on:
  push:
    branches:
      - base
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  Build:
    name: ${{ format('{0} ({1})', matrix.name, matrix.os) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Release
            os: Windows
            build_type: Release
            runner: windows-2025
            compiler: msvc19
          - name: Cache
            os: Windows
            build_type: Debug
            runner: windows-2025
            compiler: msvc19
          - name: Cache
            os: macOS
            build_type: Debug
            runner: macos-15
            compiler: appleClang16
          - name: Cache
            os: Ubuntu
            build_type: Debug
            runner: ubuntu-24.04
            compiler: gcc14
          - name: Clang Tidy
            os: Ubuntu
            build_type: Debug
            runner: ubuntu-24.04
            compiler: clang18
    uses: ./.github/workflows/build.yml
    with:
      os: ${{ matrix.os }}
      compiler: ${{ matrix.compiler }}
      build_type: ${{ matrix.build_type }}
      runner: ${{ matrix.runner }}
      save-cache: ${{ matrix.name == 'Cache' }}
      upload-artifact: ${{ matrix.name == 'Release' }}
      summarize: ${{ matrix.name == 'Clang Tidy' }}

  Docker:
    name: ${{ format('Docker Release ({0}, {1})', matrix.os, matrix.compiler) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu
            compiler: gcc14
          - os: alpine
            compiler: clang20
    runs-on: ubuntu-latest
    env:
      BUILDX_NO_DEFAULT_ATTESTATIONS: 1 # https://github.com/orgs/community/discussions/45969
      package_manager: ${{ matrix.os == 'alpine' && 'apk' || 'apt' }}
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: docker-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha
          labels: |
            org.opencontainers.image.authors=LandSandBoat Dev Teams
            org.opencontainers.image.title=LandSandBoat Server (${{ matrix.os }})
            org.opencontainers.image.documentation=https://github.com/LandSandBoat/server/wiki
          flavor: ${{ matrix.os != 'ubuntu' && format('suffix=-{0},onlatest=true', matrix.os) || '' }}

      - name: Docker build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ format('./docker/{0}.Dockerfile', matrix.os) }}
          push: true
          tags: ${{ steps.docker-meta.outputs.tags }}
          labels: ${{ steps.docker-meta.outputs.labels }}
          annotations: ${{ steps.docker-meta.outputs.annotations }}
          platforms: linux/amd64
          build-args: |
            COMPILER=${{ matrix.compiler }}
            REPO_URL=${{ github.server_url }}/${{ github.repository }}.git
            BRANCH=${{ github.ref_name }}

      - name: Build devtools image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ format('./docker/{0}.Dockerfile', matrix.os) }}
          target: devtools
          push: true
          tags: ${{ format('ghcr.io/{0}/devtools:{1}', github.repository_owner, matrix.os) }}
