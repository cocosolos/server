name: publish_latest

on:
  push:
    branches:
      - base
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  Cache_Build:
    name: Cache Build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Windows
            compiler: msvc19
            build_type: Release
            tracy: 'Tracy'
            runner: windows-2025
          - os: Windows
            compiler: msvc19
            build_type: Debug
            tracy: 'Tracy'
            runner: windows-2025
          - os: Ubuntu
            compiler: gcc14
            build_type: Debug
            tracy: 'Tracy'
            runner: ubuntu-24.04
          - os: macOS
            compiler: appleClang16
            build_type: Debug
            tracy: 'Tracy'
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      CMAKE_BUILD_TYPE: ${{ matrix.build_type }}
      SCCACHE_DIR: ${{ format('{0}/sccache', github.workspace) }}
    steps:

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: TheMrMilchmann/setup-msvc-dev@v3
        if: ${{ runner.os == 'Windows' }}
        with:
          arch: x64

      - uses: mozilla-actions/sccache-action@v0.0.9

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies (Brew)
        if: ${{ runner.os == 'macOS' }}
        run: brew install mariadb zeromq zmq luajit

      - name: Install dependencies (APT)
        if: ${{ matrix.os == 'Ubuntu' }}
        run: |
          sudo apt-get update && sudo apt-get install --assume-yes --no-install-recommends --quiet \
            binutils-dev \
            g++-14 \
            libluajit-5.1-dev \
            libmariadb-dev-compat \
            libssl-dev \
            libzmq3-dev \
            mariadb-client \
            python3-venv \
            tzdata \
            zlib1g-dev

      - name: Cache Python virtual environment
        uses: actions/cache@v4
        env:
          hash: ${{ hashFiles('./tools/requirements.txt') }}
        with:
          path: .venv
          key: ${{ format('venv-{0}-{1}-{2}', matrix.os, env.hash, github.ref_name) }}

      - name: Install Python dependencies
        env:
          venv_scripts: ${{ runner.os == 'Windows' && 'Scripts' || 'bin' }}
        run: |
          python3 -m venv .venv
          source ${{ format('.venv/{0}/activate', env.venv_scripts) }}
          python -m pip install -r ./tools/requirements.txt

      - name: Cache build
        if: ${{ matrix.build_type != 'Release' }}
        uses: actions/cache@v4
        env:
          cmake_hash: ${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}
          source_hash: ${{ hashFiles('src/**/*', 'ext/**/*') }}
        with:
          path: |
            build
            ${{ env.SCCACHE_DIR }}
          key: ${{ format('buildcache-{0}-{1}-{2}-{3}-{4}-{5}', matrix.os, matrix.compiler, matrix.build_type, github.ref_name, env.cmake_hash, env.source_hash) }}
          restore-keys: |
            ${{ format('buildcache-{0}-{1}-{2}-{3}-{4}-', matrix.os, matrix.compiler, matrix.build_type, github.ref_name, env.cmake_hash) }}

      - name: Configure CMake
        run: |
          if [[ ${{ matrix.os }} == 'Ubuntu' ]]; then
              echo "CC=/usr/bin/gcc-14" >> $GITHUB_ENV
              echo "CXX=/usr/bin/g++-14" >> $GITHUB_ENV
          fi
          cmake -G Ninja -S . -B build \
            -DTRACY_ENABLE=${{ matrix.tracy == 'Tracy' && 'ON' || 'OFF' }} \
            -DPCH_ENABLE=${{ runner.os == 'Windows' && matrix.build_type == 'Debug' && 'OFF' || 'ON' }} \
            -DCACHE_OPTION=sccache

      - name: Build
        run: |
          cmake --build build
          cp -p xi_* build/

      - name: Archive executables
        uses: actions/upload-artifact@v4
        if: ${{ runner.os == 'Windows' && matrix.build_type == 'Release' }}
        with:
          name: LSB_Windows_Release_${{ github.sha }}
          path: |
            xi_*
            ${{ matrix.tracy == 'Tracy' && 'tracy.tar.gz' || '' }}

  Docker_Build:
    name: Docker Build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu
            compiler: gcc14
            build_type: Release
            tracy: ''
          - os: alpine
            compiler: clang20
            build_type: Release
            tracy: ''
    runs-on: ubuntu-latest
    env:
      BUILDX_NO_DEFAULT_ATTESTATIONS: 1 # https://github.com/orgs/community/discussions/45969
      package_manager: ${{ matrix.os == 'alpine' && 'apk' || 'apt' }}
      build_bind_id: ${{ format('build-{0}-{1}-{2}', matrix.os, matrix.compiler, matrix.build_type) }}
      build_cache_bind_id: ${{ format('ccache-{0}-{1}-{2}', matrix.os, matrix.compiler, matrix.build_type) }}
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: docker/setup-buildx-action@v3

      - name: Cache packages
        uses: actions/cache@v4
        env:
          hash: ${{ hashFiles(format('./docker/{0}.Dockerfile', matrix.os), './tools/requirements.txt') }}
        with:
          path: |
            ${{ format('/tmp/cache-{0}', env.package_manager) }}
            ${{ format('/tmp/lib-{0}', env.package_manager) }}
            ${{ format('/tmp/cache-pip-{0}', matrix.os) }}
          key: ${{ format('cache-docker-{0}-{1}', matrix.os, env.hash) }}

      - name: Cache build
        uses: actions/cache@v4
        env:
          cmake_hash: ${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}
          source_hash: ${{ hashFiles('src/**/*', 'ext/**/*') }}
        with:
          path: |
            ${{ format('/tmp/{0}', env.build_bind_id) }}
            ${{ format('/tmp/{0}', env.build_cache_bind_id) }}
          key: ${{ format('buildcache-docker-{0}-{1}-{2}-{3}-{4}-{5}', matrix.os, matrix.compiler, matrix.build_type, github.ref_name, env.cmake_hash, env.source_hash) }}
          restore-keys: |
            ${{ format('buildcache-docker-{0}-{1}-{2}-{3}-{4}-', matrix.os, matrix.compiler, matrix.build_type, github.ref_name, env.cmake_hash) }}

      - name: Docker meta
        id: docker-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha
          labels: |
            org.opencontainers.image.authors=LandSandBoat Dev Teams
            org.opencontainers.image.title=LandSandBoat Server (${{ matrix.os }})
            org.opencontainers.image.documentation=https://github.com/LandSandBoat/server/wiki
          flavor: ${{ matrix.os != 'ubuntu' && format('suffix=-{0},onlatest=true', matrix.os) || '' }}

      # https://github.com/reproducible-containers/buildkit-cache-dance/issues/33
      - name: Inject cache into container
        uses: reproducible-containers/buildkit-cache-dance@v3.2.0
        with:
          cache-map: |
            {
              "${{ format('/tmp/cache-{0}', env.package_manager) }}": {
                "target": "${{ format('/var/cache/{0}', env.package_manager) }}",
                "id": "${{ format('cache-{0}', env.package_manager) }}"
              },
              "${{ format('/tmp/lib-{0}', env.package_manager) }}": {
                "target": "${{ format('/var/lib/{0}', env.package_manager) }}",
                "id": "${{ format('lib-{0}', env.package_manager) }}"
              },
              "${{ format('/tmp/cache-pip-{0}', matrix.os) }}": {
                "target": "/root/.cache/pip",
                "id": "${{ format('cache-pip-{0}', matrix.os) }}"
              },
              "${{ format('/tmp/{0}', env.build_bind_id) }}": {
                "target": "/root/build",
                "id": "${{ env.build_bind_id }}"
              },
              "${{ format('/tmp/{0}', env.build_cache_bind_id) }}": {
                "target": "/root/.ccache",
                "id": "${{ env.build_cache_bind_id }}"
              }
            }
          skip-extraction: false

      - name: Docker build and push
        uses: docker/build-push-action@v6
        env:
          cache_key: ${{ format('{0}-{1}-{2}-{3}', matrix.os, matrix.compiler, matrix.build_type, github.ref_name) }}
        with:
          context: .
          file: ${{ format('./docker/{0}.Dockerfile', matrix.os) }}
          push: ${{ matrix.build_type == 'Release' }}
          tags: ${{ steps.docker-meta.outputs.tags }}
          labels: ${{ steps.docker-meta.outputs.labels }}
          annotations: ${{ steps.docker-meta.outputs.annotations }}
          platforms: linux/amd64
          cache-from: ${{ format('type=registry,ref=ghcr.io/{0}/buildcache:server-{1}', github.repository_owner, env.cache_key) }}
          cache-to: ${{ format('type=registry,ref=ghcr.io/{0}/buildcache:server-{1},mode=max', github.repository_owner, env.cache_key) }}
          build-args: |
            COMPILER=${{ matrix.compiler }}
            CMAKE_BUILD_TYPE=${{ matrix.build_type }}
            TRACY_ENABLE=${{ matrix.tracy == 'Tracy' && 'ON' || 'OFF' }}
            REPO_URL=${{ github.server_url }}/${{ github.repository }}.git
            BRANCH=${{ github.ref_name }}

      - name: Build devtools image
        uses: docker/build-push-action@v6
        if: ${{ matrix.build_type == 'Release' }}
        with:
          context: .
          file: ${{ format('./docker/{0}.Dockerfile', matrix.os) }}
          target: devtools
          push: true
          tags: ${{ format('ghcr.io/{0}/devtools:{1}', github.repository_owner, matrix.os) }}
          cache-from: ${{ format('type=registry,ref=ghcr.io/{0}/buildcache:devtools-{1}', github.repository_owner, matrix.os) }}
          cache-to: ${{ format('type=registry,ref=ghcr.io/{0}/buildcache:devtools-{1},mode=max', github.repository_owner, matrix.os) }}
