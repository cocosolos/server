name: build

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

# # Available machines:
# # https://github.com/actions/runner-images/tree/main
jobs:
  Sanity_Checks:
    name: Sanity Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run checks
        id: run_checks
        run: >
          docker run --mount type=bind,src=.,dst=/server
          -e GIT_REF=origin/${{ github.event.pull_request.base.ref }}
          --rm ghcr.io/${{ github.repository_owner }}/devtools:ubuntu
          /bin/bash -c '/server/tools/ci/sanity_checks/main.sh'

      - name: Summarize checks
        id: summarize_checks
        if: ${{ always() }}
        run: |
          echo "## Sanity Check Results" >> $GITHUB_STEP_SUMMARY
          found_issues=false
          for check_file in ./*_checks.md; do
              if [[ -f "$check_file" ]]; then
                check_name=$(basename "$check_file" _checks.md | sed 's/.*/\u&/; s/_\(.\)/ \u\1/g')
                if [[ -s "$check_file" ]]; then
                    found_issues=true
                    echo "### :x: ${check_name} Checks Failed" >> $GITHUB_STEP_SUMMARY
                    tr -d '\r' < "$check_file" >> $GITHUB_STEP_SUMMARY
                    echo "" >> $GITHUB_STEP_SUMMARY
                else
                    echo "### :heavy_check_mark: ${check_name} Checks Passed" >> $GITHUB_STEP_SUMMARY
                    echo "" >> $GITHUB_STEP_SUMMARY
                fi
              fi
          done
          for check_file in ./*_checks.txt; do
              if [[ -f "$check_file" ]]; then
                check_name=$(basename "$check_file" _checks.txt | sed 's/.*/\u&/; s/_\(.\)/ \u\1/g')
                if [[ -s "$check_file" ]]; then
                    found_issues=true
                    echo "### :x: ${check_name} Checks Failed" >> $GITHUB_STEP_SUMMARY
                    echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
                    tr -d '\r' < "$check_file" >> $GITHUB_STEP_SUMMARY
                    echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
                    echo "" >> $GITHUB_STEP_SUMMARY
                else
                    echo "### :heavy_check_mark: ${check_name} Checks Passed" >> $GITHUB_STEP_SUMMARY
                    echo "" >> $GITHUB_STEP_SUMMARY
                fi
              fi
          done
          if [[ "$found_issues" == "false" ]]; then
              if [[ "${{ steps.run_checks.outcome }}" != "success" ]]; then
                  echo "### :x: Sanity check failed, but no specific output files were found/populated." >> $GITHUB_STEP_SUMMARY
                  echo "Check the logs of the 'Run tests' step for details." >> $GITHUB_STEP_SUMMARY
                  found_issues=true
              fi
          fi
          echo "issues_found=$found_issues" >> $GITHUB_OUTPUT
      - name: Fail Workflow if Checks Failed
        if: ${{ steps.run_checks.outcome == 'failure' || steps.summarize_checks.outputs.issues_found == 'true' }}
        run: |
          echo "Sanity checks failed. See summary for details."
          exit 1

  Lua_Language_server:
    name: Lua Language Server
    needs: Sanity_Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Lua Language Server
        id: run_lls
        run: >
          docker run --mount type=bind,src=.,dst=/server
          --rm ghcr.io/${{ github.repository_owner }}/devtools:ubuntu
          /bin/bash -c 'python ./tools/ci/lua_lang_server.py'

      - name: Summarize run
        id: summarize_run
        if: ${{ always() }}
        run: |
          echo "## Lua Language Server Results" >> $GITHUB_STEP_SUMMARY
          found_issues=false
          check_file=lua_lang_errors.txt
          if [[ -f "$check_file" && -s "$check_file" ]]; then
              found_issues=true
              echo "### :x: Run Failed" >> $GITHUB_STEP_SUMMARY
              echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
              tr -d '\r' < "$check_file" >> $GITHUB_STEP_SUMMARY
              echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
          fi
          if [[ "$found_issues" == "false" ]]; then
              if [[ "${{ steps.run_lls.outcome }}" == "success" ]]; then
                  echo "### :heavy_check_mark: All checks passed." >> $GITHUB_STEP_SUMMARY
              else
                  echo "### :x: Lua Language Server had errors, but no specific output was found." >> $GITHUB_STEP_SUMMARY
                  echo "Check the logs of the 'Run Lua Language Server' step for details." >> $GITHUB_STEP_SUMMARY
                  found_issues=true
              fi
          fi
          echo "issues_found=$found_issues" >> $GITHUB_OUTPUT
      - name: Fail Workflow if Checks Failed
        if: ${{ steps.run_lls.outcome == 'failure' || steps.summarize_run.outputs.issues_found == 'true' }}
        run: |
          echo "Lua Language Server failed. See summary for details."
          exit 1

  Build:
    needs: Sanity_Checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Windows
            compiler: msvc19
            build_type: Debug
            tracy: 'Tracy'
            runner: windows-2025
          - os: Ubuntu
            compiler: gcc14
            build_type: Debug
            tracy: 'Tracy'
            runner: ubuntu-24.04
          - os: macOS
            compiler: appleClang16
            build_type: Debug
            tracy: 'Tracy'
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      package_manager: apt
      build_dir: ${{ format('build-{0}-{1}', matrix.os, matrix.compiler) }}
      ccache_dir: ${{ format('ccache-{0}-{1}', matrix.os, matrix.compiler) }}
    steps:

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: microsoft/setup-msbuild@v2
        if: ${{ runner.os == 'Windows' }}
        with:
          msbuild-architecture: x64

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies (Brew)
        if: ${{ runner.os == 'macOS' }}
        run: brew install mariadb zeromq zmq luajit

      - name: Install Dependencies (APT)
        if: ${{ matrix.os == 'Ubuntu' }}
        run: |
          sudo apt-get update && sudo apt-get install --assume-yes --no-install-recommends --quiet \
            binutils-dev \
            build-essential \
            ca-certificates \
            ccache \
            cmake \
            git \
            g++-14 \
            libluajit-5.1-dev \
            libmariadb-dev-compat \
            libssl-dev \
            libzmq3-dev \
            make \
            mariadb-client \
            ninja-build \
            python3-dev \
            python3-venv \
            tzdata \
            zlib1g-dev

      - name: Restore build cache
        uses: actions/cache/restore@v4
        env:
          hash: ${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}
        with:
          path: |
            ${{ env.build_dir }}
            ${{ env.ccache_dir }}
          key: ${{ format('buildcache-{0}-{1}-{2}-{3}-{4}', matrix.os, env.hash, matrix.compiler, matrix.build_type, github.base_ref) }}
          restore-keys: |
            ${{ format('buildcache-{0}-{1}-{2}-{3}-', matrix.os, env.hash, matrix.compiler, matrix.build_type) }}
            ${{ format('buildcache-{0}-{1}-{2}-', matrix.os, env.hash, matrix.compiler) }}

      # TODO: only do this if src modules changed.
      # - name: Enable modules
      #   run: |
      #     python3 <<EOF
      #     with open("modules/init.txt", "w") as f:
      #         f.write("custom\n")
      #         f.write("era\n")
      #         f.write("example\n")
      #         f.write("renamer\n")
      #     EOF

      - name: Configure CMake
        run: |
          echo "CCACHE_DIR=${{ env.ccache_dir }}" >> $GITHUB_ENV
          if [[ ${{ matrix.os }} == 'Ubuntu' ]]; then
              echo "CC=/usr/bin/gcc-14" >> $GITHUB_ENV
              echo "CXX=/usr/bin/g++-14" >> $GITHUB_ENV
          fi
          cp -p ${{ env.build_dir }}/xi_* . 2> /dev/null || true
          rm ${{ env.build_dir }}/CMakeCache.txt || true
          cmake -S . -B ${{ env.build_dir }} \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DENABLE_TRACY=${{ matrix.tracy == 'Tracy' && 'ON' || 'OFF' }}

      - name: Build
        run: |
          cmake --build ${{ env.build_dir }} -j$(${{ runner.os == 'macOS' && 'sysctl -n hw.logicalcpu' || 'nproc' }})

      - name: Create artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ format('LSB_{0}_{1}_{2}', matrix.os, matrix.build_type, github.sha) }}
          path: |
                xi_*
                src/common/version.cpp
                ${{ matrix.tracy == 'Tracy' && 'tracy.tar.gz' || '' }}

  Startup_Checks_Linux:
    name: Startup Checks (Linux)
    needs: Build
    if: ${{ !cancelled() && needs.Build.result == 'success' }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/devtools:ubuntu
      volumes:
        - ./:/server/
    env:
      XI_NETWORK_SQL_HOST: database
      XI_NETWORK_SQL_PORT: 3306
      XI_NETWORK_SQL_DATABASE: xidb
      XI_NETWORK_SQL_LOGIN: xiadmin
      XI_NETWORK_SQL_PASSWORD: 'password'
    services:
      database:
        image: mariadb:latest
        env:
          MARIADB_DATABASE: ${{ env.XI_NETWORK_SQL_DATABASE }}
          MARIADB_USER: ${{ env.XI_NETWORK_SQL_LOGIN }}
          MARIADB_PASSWORD: ${{ env.XI_NETWORK_SQL_PASSWORD }}
          MARIADB_RANDOM_ROOT_PASSWORD: true
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=10s
          --health-retries=10
    steps:

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive # For navmeshes

      - name: Clone Git metadata
        run: |
          git clone --bare --filter=tree:0 --branch ${{ github.ref_name }} ${{ github.server_url }}/${{ github.repository }}.git /server/.git
          cd /server/.git && git config --local --bool core.bare false

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ format('LSB_Ubuntu_Debug_{0}', github.sha) }}
          path: .

      - name: Rename Tracy executables
        run: mv xi_map_tracy xi_map

      - name: Install Python dependencies
        run: |
          python -m pip install -r ./tools/requirements.txt

      # TODO: only do this if script/sql modules changed.
      # - name: Enable modules
      #   run: |
      #     python <<EOF
      #     with open("modules/init.txt", "w") as f:
      #         f.write("custom\n")
      #         f.write("era\n")
      #         f.write("example\n")
      #         f.write("renamer\n")
      #     EOF

      - name: Initialize database
        id: init_db
        run: python ./tools/dbtool.py update

      - name: Run tests
        id: tests
        run: python -m tools.ci.startup_checks

      - name: Summarize checks
        id: summarize_checks
        if: ${{ always() }}
        run: |
          echo "## Startup Results" >> $GITHUB_STEP_SUMMARY
          found_issues=false
          for log_file in ./log/*.log; do
              if [[ -f "$log_file" && -s "$log_file" ]]; then
                  if grep -qi "warning\|error\|crash\|critical" "$log_file"; then
                      found_issues=true
                      log_name=$(basename "$log_file" .log | sed 's/.*/\u&/; s/-\(.\)/ \u\1/g')
                      echo "### :x: ${log_name} Checks Failed" >> $GITHUB_STEP_SUMMARY
                      echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
                      grep -i "warning\|error\|crash\|critical" "$log_file" >> $GITHUB_STEP_SUMMARY
                      echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
                      echo "" >> $GITHUB_STEP_SUMMARY
                  fi
              fi
          done
          if [[ "$found_issues" == "false" ]]; then
              if [[ "${{ steps.tests.outcome }}" == "success" ]]; then
                  echo "### :heavy_check_mark: All checks passed." >> $GITHUB_STEP_SUMMARY
              else
                  echo "### :x: Combat check failed, but no specific errors were found." >> $GITHUB_STEP_SUMMARY
                  echo "Check the logs of the 'Combat tests' step for details." >> $GITHUB_STEP_SUMMARY
                  found_issues=true
              fi
          fi
          for log_file in ./log/*.log; do
              if [[ -f "$log_file" && -s "$log_file" ]]; then
                  log_name=$(basename "$log_file" .log | sed 's/.*/\u&/; s/-\(.\)/ \u\1/g')
                  echo "### :sailboat: ${log_name}" >> $GITHUB_STEP_SUMMARY
                  echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
                  cat "$log_file" >> $GITHUB_STEP_SUMMARY
                  echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
              fi
          done
          echo "issues_found=$found_issues" >> $GITHUB_OUTPUT
      - name: Fail Workflow if Checks Failed
        if: ${{ steps.tests.outcome == 'failure' || steps.summarize_checks.outputs.issues_found == 'true' }}
        run: |
          echo "Startup checks failed. See summary for details."
          exit 1

  Startup_Checks_Windows:
    name: Startup Checks (Windows)
    runs-on: windows-2025
    needs: Build
    if: ${{ !cancelled() && needs.Build.result == 'success' }}
    defaults:
      run:
        shell: bash
    env:
      XI_NETWORK_SQL_HOST: 127.0.0.1
      XI_NETWORK_SQL_PORT: 3306
      XI_NETWORK_SQL_DATABASE: xidb
      XI_NETWORK_SQL_LOGIN: root
      XI_NETWORK_SQL_PASSWORD: 'root'
    steps:
      - uses: actions/setup-python@v5
        id: setup_python
        with:
          python-version: '3.12'

      - uses: zach2good/setup-mariadb@v1
        with:
          database: ${{ env.XI_NETWORK_SQL_DATABASE }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive # For navmeshes

      - uses: actions/download-artifact@v4
        with:
          name: ${{ format('LSB_Windows_Debug_{0}', github.sha) }}
          path: .
      - run: mv xi_map_tracy.exe xi_map.exe

      - name: Restore Python cache
        id: python-cache
        uses: actions/cache/restore@v4
        env:
          hash: ${{ hashFiles('./tools/requirements.txt') }}
        with:
          path: .venv
          key: ${{ format('cache-Windows-{0}-{1}', env.hash, github.base_ref) }}
          restore-keys: |
            ${{ format('cache-Windows-{0}-', env.hash) }}
            cache-Windows-

      - name: Install Python dependencies
        if: ${{ !steps.python-cache.outputs.cache-hit }}
        run: |
          python3 -m venv .venv
          source .venv/Scripts/activate
          python -m pip install -r ./tools/requirements.txt

      - name: Activate Python virtual environment
        run: |
          echo ".venv/Scripts" >> $GITHUB_PATH
          echo "VIRTUAL_ENV=$(pwd)/.venv" >> $GITHUB_ENV

      # TODO: only do this if src modules changed.
      # - name: Enable modules
      #   run: |
      #     python <<EOF
      #     with open("modules/init.txt", "w") as f:
      #         f.write("custom\n")
      #         f.write("era\n")
      #         f.write("example\n")
      #         f.write("renamer\n")
      #     EOF

      - name: Import SQL files
        run: python ./tools/dbtool.py update

      - name: Startup checks
        id: tests
        run: python -m tools.ci.startup_checks

      - name: Summarize checks
        id: summarize_checks
        if: ${{ always() }}
        run: |
          echo "## Startup Results" >> $GITHUB_STEP_SUMMARY
          found_issues=false
          for log_file in ./log/*.log; do
              if [[ -f "$log_file" && -s "$log_file" ]]; then
                  if grep -qi "warning\|error\|crash\|critical" "$log_file"; then
                      found_issues=true
                      log_name=$(basename "$log_file" .log | sed 's/.*/\u&/; s/-\(.\)/ \u\1/g')
                      echo "### :x: ${log_name} Tests Failed" >> $GITHUB_STEP_SUMMARY
                      echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
                      grep -i "warning\|error\|crash\|critical" "$log_file" >> $GITHUB_STEP_SUMMARY
                      echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
                      echo "" >> $GITHUB_STEP_SUMMARY
                  fi
              fi
          done
          if [[ "$found_issues" == "false" ]]; then
              if [[ "${{ steps.tests.outcome }}" == "success" ]]; then
                  echo "### :heavy_check_mark: All tests passed." >> $GITHUB_STEP_SUMMARY
              else
                  echo "### :x: Startup tests failed, but no specific errors were found." >> $GITHUB_STEP_SUMMARY
                  echo "Check the logs of the 'Startup tests' step for details." >> $GITHUB_STEP_SUMMARY
                  found_issues=true
              fi
          fi
          for log_file in ./log/*.log; do
              if [[ -f "$log_file" && -s "$log_file" ]]; then
                  log_name=$(basename "$log_file" .log | sed 's/.*/\u&/; s/-\(.\)/ \u\1/g')
                  echo "### :sailboat: ${log_name}" >> $GITHUB_STEP_SUMMARY
                  echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
                  cat "$log_file" >> $GITHUB_STEP_SUMMARY
                  echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
              fi
          done
          echo "issues_found=$found_issues" >> $GITHUB_OUTPUT
      - name: Fail Workflow if Checks Failed
        if: ${{ steps.tests.outcome == 'failure' || steps.summarize_checks.outputs.issues_found == 'true' }}
        run: |
          echo "Startup checks failed. See summary for details."
          exit 1
