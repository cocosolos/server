  # https://github.com/actions/runner-images/blob/main/images/windows/Windows2025-Readme.md
  Build_Windows:
    name: Build Windows
    needs: Sanity_Checks
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]
    steps:
      - uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Restore build cache
        uses: actions/cache/restore@v4
        env:
          hash: ${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}
        with:
          path: build
          key: ${{ format('buildcache-windows-{0}-{1}-{2}', env.hash, matrix.build_type, github.base_ref) }}
          restore-keys: |
            ${{ format('buildcache-windows-{0}-{1}-', env.hash, matrix.build_type) }}
            ${{ format('buildcache-windows-{0}-', env.hash) }}

      # TODO: only do this if src modules changed.
      # - name: Enable modules
      #   run: |
      #     python3 <<EOF
      #     with open("modules/init.txt", "w") as f:
      #         f.write("custom\n")
      #         f.write("era\n")
      #         f.write("example\n")
      #         f.write("renamer\n")
      #     EOF

      - name: Configure CMake
        run: |
          cp -p build/xi_* . 2> /dev/null || true
          rm CMakeCache.txt || true
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DENABLE_TRACY=${{ matrix.build_type == 'Debug' && 'ON' || 'OFF' }}

      - name: Build
        run: |
          cmake --build build -j$(nproc)

      - name: Archive debug executables
        uses: actions/upload-artifact@v4
        if: ${{ matrix.build_type == 'Debug' }}
        with:
          name: windows_executables_Debug
          path: |
            xi_*
            src/common/version.cpp
            build
            tracy.tar.gz

  Startup_Checks_Windows:
    name: Startup Checks
    runs-on: windows-2025
    needs: Build_Windows
    if: ${{ !cancelled() && needs.Build_Windows.result == 'success' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/setup-python@v5
        id: setup_python
        with:
          python-version: "3.12"

      - uses: zach2good/setup-mariadb@v1
        with:
          database: xidb

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive # For navmeshes

      - uses: actions/download-artifact@v4
        with:
          name: windows_executables_Debug
          path: .
      - run: mv xi_map_tracy.exe xi_map.exe

      - name: Restore Python cache
        id: python-cache
        uses: actions/cache/restore@v4
        env:
          hash: ${{ hashFiles('./tools/requirements.txt') }}
        with:
          path: .venv
          key: ${{ format('cache-windows-{0}-{1}', env.hash, github.base_ref) }}
          restore-keys: |
            ${{ format('cache-windows-{0}-', env.hash) }}
            cache-windows-

      - name: Install Python dependencies
        if: ${{ !steps.python-cache.outputs.cache-hit }}
        run: |
          python3 -m venv .venv
          source .venv/Scripts/activate
          python -m pip install -r ./tools/requirements.txt

      - name: Activate Python virtual environment
        run: |
          echo ".venv/Scripts" >> $GITHUB_PATH
          echo "VIRTUAL_ENV=$(pwd)/.venv" >> $GITHUB_ENV

      - name: Verify Python virtual environment
        run: |
          which python
          python --version
          python -m pip --version
          python -m pip list

      # TODO: only do this if src modules changed.
      # - name: Enable modules
      #   run: |
      #     python <<EOF
      #     with open("modules/init.txt", "w") as f:
      #         f.write("custom\n")
      #         f.write("era\n")
      #         f.write("example\n")
      #         f.write("renamer\n")
      #     EOF

      - name: Import SQL files
        run: python ./tools/dbtool.py update

      - name: Startup checks
        id: tests
        run: python -m tools.ci.startup_checks

      - name: Summarize checks
        id: summarize_checks
        if: ${{ always() }}
        run: |
          echo "## Startup Results" >> $GITHUB_STEP_SUMMARY
          found_issues=false
          for log_file in ./log/*.log; do
              if [[ -f "$log_file" && -s "$log_file" ]]; then
                  if grep -qi "warning\|error\|crash\|critical" "$log_file"; then
                      found_issues=true
                      log_name=$(basename "$log_file" .log | sed 's/.*/\u&/; s/-\(.\)/ \u\1/g')
                      echo "### :x: ${log_name} Tests Failed" >> $GITHUB_STEP_SUMMARY
                      echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
                      grep -i "warning\|error\|crash\|critical" "$log_file" >> $GITHUB_STEP_SUMMARY
                      echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
                      echo "" >> $GITHUB_STEP_SUMMARY
                  fi
              fi
          done
          if [[ "$found_issues" == "false" ]]; then
              if [[ "${{ steps.tests.outcome }}" == "success" ]]; then
                  echo "### :heavy_check_mark: All tests passed." >> $GITHUB_STEP_SUMMARY
              else
                  echo "### :x: Startup tests failed, but no specific errors were found." >> $GITHUB_STEP_SUMMARY
                  echo "Check the logs of the 'Startup tests' step for details." >> $GITHUB_STEP_SUMMARY
                  found_issues=true
              fi
          fi
          for log_file in ./log/*.log; do
              if [[ -f "$log_file" && -s "$log_file" ]]; then
                  log_name=$(basename "$log_file" .log | sed 's/.*/\u&/; s/-\(.\)/ \u\1/g')
                  echo "### :sailboat: ${log_name}" >> $GITHUB_STEP_SUMMARY
                  echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
                  cat "$log_file" >> $GITHUB_STEP_SUMMARY
                  echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
              fi
          done
          echo "issues_found=$found_issues" >> $GITHUB_OUTPUT
      - name: Fail Workflow if Checks Failed
        if: ${{ steps.tests.outcome == 'failure' || steps.summarize_checks.outputs.issues_found == 'true' }}
        run: |
          echo "Startup checks failed. See summary for details."
          exit 1

  # https://github.com/actions/runner-images/blob/main/images/macos/macos-15-Readme.md
  Build_MacOS:
    name: Build MacOS
    needs: Sanity_Checks
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install Dependencies (Brew)
        run: |
          brew install mariadb zeromq zmq luajit
      - name: Configure CMake
        run: |
          mkdir -p build
          cmake -S . -B build
      - name: Build
        run: |
          cmake --build build -j4
