name: ci

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

# # Available machines:
# # https://github.com/actions/runner-images/tree/main
jobs:
  Sanity_Checks:
    name: Sanity Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run checks
        id: run_checks
        run: >
          docker run --mount type=bind,src=.,dst=/server
          -e GIT_REF=origin/${{ github.event.pull_request.base.ref }}
          --rm ghcr.io/${{ github.repository_owner }}/devtools:ubuntu
          /bin/bash -c '/server/tools/ci/sanity_checks/main.sh'

      - name: Summarize checks
        id: summarize_checks
        if: ${{ always() }}
        run: |
          echo "## Sanity Check Results" >> $GITHUB_STEP_SUMMARY
          found_issues=false
          for check_file in ./*_checks.md; do
              if [[ -f "$check_file" ]]; then
                check_name=$(basename "$check_file" _checks.md | sed 's/.*/\u&/; s/_\(.\)/ \u\1/g')
                if [[ -s "$check_file" ]]; then
                    found_issues=true
                    echo "### :x: ${check_name} Checks Failed" >> $GITHUB_STEP_SUMMARY
                    tr -d '\r' < "$check_file" >> $GITHUB_STEP_SUMMARY
                    echo "" >> $GITHUB_STEP_SUMMARY
                else
                    echo "### :heavy_check_mark: ${check_name} Checks Passed" >> $GITHUB_STEP_SUMMARY
                    echo "" >> $GITHUB_STEP_SUMMARY
                fi
              fi
          done
          for check_file in ./*_checks.txt; do
              if [[ -f "$check_file" ]]; then
                check_name=$(basename "$check_file" _checks.txt | sed 's/.*/\u&/; s/_\(.\)/ \u\1/g')
                if [[ -s "$check_file" ]]; then
                    found_issues=true
                    echo "### :x: ${check_name} Checks Failed" >> $GITHUB_STEP_SUMMARY
                    echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
                    tr -d '\r' < "$check_file" >> $GITHUB_STEP_SUMMARY
                    echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
                    echo "" >> $GITHUB_STEP_SUMMARY
                else
                    echo "### :heavy_check_mark: ${check_name} Checks Passed" >> $GITHUB_STEP_SUMMARY
                    echo "" >> $GITHUB_STEP_SUMMARY
                fi
              fi
          done
          if [[ "$found_issues" == "false" ]]; then
              if [[ "${{ steps.run_checks.outcome }}" != "success" ]]; then
                  echo "### :x: Sanity check failed, but no specific output files were found/populated." >> $GITHUB_STEP_SUMMARY
                  echo "Check the logs of the 'Run tests' step for details." >> $GITHUB_STEP_SUMMARY
                  found_issues=true
              fi
          fi
          echo "issues_found=$found_issues" >> $GITHUB_OUTPUT
      - name: Fail Workflow if Checks Failed
        if: ${{ steps.run_checks.outcome == 'failure' || steps.summarize_checks.outputs.issues_found == 'true' }}
        run: |
          echo "Sanity checks failed. See summary for details."
          exit 1

  Lua_Language_server:
    name: Lua Language Server
    needs: Sanity_Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Lua Language Server
        id: run_lls
        run: >
          docker run --mount type=bind,src=.,dst=/server
          --rm ghcr.io/${{ github.repository_owner }}/devtools:ubuntu
          /bin/bash -c 'python ./tools/ci/lua_lang_server.py'

      - name: Summarize run
        id: summarize_run
        if: ${{ always() }}
        run: |
          echo "## Lua Language Server Results" >> $GITHUB_STEP_SUMMARY
          found_issues=false
          check_file=lua_lang_errors.txt
          if [[ -f "$check_file" && -s "$check_file" ]]; then
              found_issues=true
              echo "### :x: Run Failed" >> $GITHUB_STEP_SUMMARY
              echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
              tr -d '\r' < "$check_file" >> $GITHUB_STEP_SUMMARY
              echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
          fi
          if [[ "$found_issues" == "false" ]]; then
              if [[ "${{ steps.run_lls.outcome }}" == "success" ]]; then
                  echo "### :heavy_check_mark: All checks passed." >> $GITHUB_STEP_SUMMARY
              else
                  echo "### :x: Lua Language Server had errors, but no specific output was found." >> $GITHUB_STEP_SUMMARY
                  echo "Check the logs of the 'Run Lua Language Server' step for details." >> $GITHUB_STEP_SUMMARY
                  found_issues=true
              fi
          fi
          echo "issues_found=$found_issues" >> $GITHUB_OUTPUT
      - name: Fail Workflow if Checks Failed
        if: ${{ steps.run_lls.outcome == 'failure' || steps.summarize_run.outputs.issues_found == 'true' }}
        run: |
          echo "Lua Language Server failed. See summary for details."
          exit 1

  # https://github.com/actions/runner-images/blob/main/images/ubuntu/Ubuntu2404-Readme.md
  Build_Linux:
    name: Build Linux
    needs: Sanity_Checks
    runs-on: ubuntu-latest
    env:
      package_manager: ${{ matrix.os == 'alpine' && 'apk' || 'apt' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu
            compiler: clang18
            build_type: Release
          - os: ubuntu
            compiler: gcc14
            build_type: Debug
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha
          labels: |
            org.opencontainers.image.authors=LandSandBoat Dev Teams
            org.opencontainers.image.title=LandSandBoat Server (${{ matrix.os }})
            org.opencontainers.image.documentation=https://github.com/LandSandBoat/server/wiki
          flavor: ${{ format('suffix=-{0}', matrix.compiler) }}

      - name: Restore packages cache
        uses: actions/cache/restore@v4
        env:
          hash: ${{ hashFiles(format('./docker/{0}.Dockerfile', matrix.os), './tools/requirements.txt') }}
        with:
          path: |
            ${{ format('cache-{0}', env.package_manager) }}
            ${{ format('lib-{0}', env.package_manager) }}
            ${{ format('cache-pip-{0}', matrix.os) }}
          key: ${{ format('cache-{0}-{1}-{2}', matrix.os, env.hash, github.base_ref) }}
          restore-keys: |
            ${{ format('cache-{0}-{1}-', matrix.os, env.hash) }}
            ${{ format('cache-{0}-', matrix.os) }}

      - name: Restore build cache
        uses: actions/cache/restore@v4
        env:
          hash: ${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}
        with:
          path: |
            ${{ format('build-{0}-{1}', matrix.os, matrix.compiler ) }}
            ${{ format('ccache-{0}-{1}', matrix.os, matrix.compiler ) }}
          key: ${{ format('buildcache-{0}-{1}-{2}-{3}-{4}', matrix.os, env.hash, matrix.compiler, matrix.build_type, github.base_ref) }}
          restore-keys: |
            ${{ format('buildcache-{0}-{1}-{2}-{3}-', matrix.os, env.hash, matrix.compiler, matrix.build_type) }}
            ${{ format('buildcache-{0}-{1}-{2}-', matrix.os, env.hash, matrix.compiler) }}

      # https://github.com/reproducible-containers/buildkit-cache-dance/issues/33
      - name: Inject cache
        uses: reproducible-containers/buildkit-cache-dance@v3.2.0
        with:
          cache-map: |
            {
              ${{ format('"cache-{0}":"/var/cache/{1}",', env.package_manager, env.package_manager) }}
              ${{ format('"lib-{0}":"/var/lib/{1}",', env.package_manager, env.package_manager) }}
              ${{ format('"cache-pip-{0}":"/root/.cache/pip",', matrix.os) }}
              ${{ format('"build-{0}-{1}":"/root/build",', matrix.os, matrix.compiler) }}
              ${{ format('"ccache-{0}-{1}":"/root/.ccache"', matrix.os, matrix.compiler) }}
            }
          skip-extraction: true

      - name: Set image artifact name
        id: name_artifact
        run: |
          actual_artifact_name="${{ format('{0}_image_{1}', matrix.os, matrix.build_type) }}"
          echo "artifact_name=${actual_artifact_name}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v6
        env:
          BUILDX_NO_DEFAULT_ATTESTATIONS: 1 # https://github.com/orgs/community/discussions/45969
          artifact_name: ${{ steps.name_artifact.outputs.artifact_name }}
        with:
          context: .
          file: ${{ format('./docker/{0}.Dockerfile', matrix.os) }}
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          platforms: linux/amd64
          cache-from: ${{ format('type=registry,ref=ghcr.io/{0}/buildcache:server-{1}-{2}-{3}-{4}', github.repository_owner, matrix.os, matrix.compiler, matrix.build_type, github.base_ref) }}
          build-args: |
            COMPILER=${{ matrix.compiler }}
            CMAKE_BUILD_TYPE=${{ matrix.build_type }}
            ENABLE_TRACY=${{ matrix.build_type == 'Debug' && 'ON' || 'OFF' }}
            REPO_URL=${{ github.server_url }}/${{ github.repository }}.git
            BRANCH=${{ github.head_ref }}
          outputs: ${{ matrix.build_type == 'Debug' && format('type=docker,dest={0}/{1}.tar', runner.temp, env.artifact_name) }}

      - name: Archive debug image
        uses: actions/upload-artifact@v4
        if: ${{ matrix.build_type == 'Debug' }}
        env:
          artifact_name: ${{ steps.name_artifact.outputs.artifact_name }}
        with:
          name: ${{ env.artifact_name }}
          path: ${{ format('{0}/{1}.tar', runner.temp, env.artifact_name) }}

  Startup_Checks_Linux:
    name: Startup Checks
    runs-on: ubuntu-latest
    needs: Build_Linux
    if: ${{ !cancelled() && needs.Build_Linux.result == 'success' }}
    env:
      MARIADB_DATABASE: xidb
      MARIADB_USER: xiadmin
      MARIADB_PASSWORD: "password"
    services:
      database:
        image: mariadb:latest
        env:
          MARIADB_DATABASE: ${{ env.MARIADB_DATABASE }}
          MARIADB_USER: ${{ env.MARIADB_USER }}
          MARIADB_PASSWORD: ${{ env.MARIADB_PASSWORD }}
          MARIADB_RANDOM_ROOT_PASSWORD: true
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=10s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive # For navmeshes

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ubuntu_image_Debug
          path: ${{ runner.temp }}

      - name: Start container
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.number }}
        run: |
          IMAGE_TO_RUN="ghcr.io/${{ github.repository }}:pr-${{ env.PR_NUMBER }}-gcc14"
          docker load --input ${{ runner.temp }}/ubuntu_image_Debug.tar

          echo "Attempting to run image: $IMAGE_TO_RUN"
          docker image inspect "$IMAGE_TO_RUN" > /dev/null 2>&1 || \
            echo "Warning: Image $IMAGE_TO_RUN not found. Check loaded images and tagging."
          docker image ls

          docker run -dt \
            --name test-server \
            --user root \
            --network ${{ job.services.database.network }} \
            --mount type=bind,src=./log,dst=/server/log \
            --mount type=bind,src=./losmeshes,dst=/server/losmeshes \
            --mount type=bind,src=./navmeshes,dst=/server/navmeshes \
            --env XI_NETWORK_SQL_HOST=database \
            --env XI_NETWORK_SQL_PORT=3306 \
            --env XI_NETWORK_SQL_DATABASE=${{ env.MARIADB_DATABASE }} \
            --env XI_NETWORK_SQL_LOGIN=${{ env.MARIADB_USER }} \
            --env XI_NETWORK_SQL_PASSWORD=${{ env.MARIADB_PASSWORD }} \
          "$IMAGE_TO_RUN"

      - name: Initialize database
        id: init_db
        run: docker exec test-server /bin/bash -c 'python ./tools/dbtool.py update'

      - name: Run tests
        id: tests
        run: docker exec test-server /bin/bash -c 'python -m tools.ci.startup_checks'

      - name: Stop container
        run: |
          docker stop test-server
          docker rm test-server

      - name: Summarize checks
        id: summarize_checks
        if: ${{ always() }}
        run: |
          echo "## Startup Results" >> $GITHUB_STEP_SUMMARY
          found_issues=false
          for log_file in ./log/*.log; do
              if [[ -f "$log_file" && -s "$log_file" ]]; then
                  if grep -qi "warning\|error\|crash\|critical" "$log_file"; then
                      found_issues=true
                      log_name=$(basename "$log_file" .log | sed 's/.*/\u&/; s/-\(.\)/ \u\1/g')
                      echo "### :x: ${log_name} Checks Failed" >> $GITHUB_STEP_SUMMARY
                      echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
                      grep -i "warning\|error\|crash\|critical" "$log_file" >> $GITHUB_STEP_SUMMARY
                      echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
                      echo "" >> $GITHUB_STEP_SUMMARY
                  fi
              fi
          done
          if [[ "$found_issues" == "false" ]]; then
              if [[ "${{ steps.tests.outcome }}" == "success" ]]; then
                  echo "### :heavy_check_mark: All checks passed." >> $GITHUB_STEP_SUMMARY
              else
                  echo "### :x: Combat check failed, but no specific errors were found." >> $GITHUB_STEP_SUMMARY
                  echo "Check the logs of the 'Combat tests' step for details." >> $GITHUB_STEP_SUMMARY
                  found_issues=true
              fi
          fi
          for log_file in ./log/*.log; do
              if [[ -f "$log_file" && -s "$log_file" ]]; then
                  log_name=$(basename "$log_file" .log | sed 's/.*/\u&/; s/-\(.\)/ \u\1/g')
                  echo "### :sailboat: ${log_name}" >> $GITHUB_STEP_SUMMARY
                  echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
                  cat "$log_file" >> $GITHUB_STEP_SUMMARY
                  echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
              fi
          done
          echo "issues_found=$found_issues" >> $GITHUB_OUTPUT
      - name: Fail Workflow if Checks Failed
        if: ${{ steps.tests.outcome == 'failure' || steps.summarize_checks.outputs.issues_found == 'true' }}
        run: |
          echo "Startup checks failed. See summary for details."
          exit 1

