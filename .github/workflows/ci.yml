name: ci

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

# # Available machines:
# # https://github.com/actions/runner-images/tree/main
jobs:
  Sanity_Checks:
    name: Sanity Checks
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/devtools:ubuntu
    defaults:
      run:
        shell: bash
    env:
      GIT_REF: origin/${{ github.event.pull_request.base.ref }}
    steps:
      # github.workspace is the workspace in the runner (/home/runner/work/server/server)
      # $GITHUB_WORKSPACE is the workspace in the container (/__w/server/server)
      - run: git config --global --add safe.directory $GITHUB_WORKSPACE
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run checks
        id: run_checks
        run: ./tools/ci/sanity_checks/main.sh

      - name: Summarize checks
        id: summarize_checks
        if: ${{ always() }}
        run: |
          echo "## Sanity Check Results" >> $GITHUB_STEP_SUMMARY
          found_issues=false
          for check_file in ./*_checks.md; do
              if [[ -f "$check_file" ]]; then
                check_name=$(basename "$check_file" _checks.md | sed 's/.*/\u&/; s/_\(.\)/ \u\1/g')
                if [[ -s "$check_file" ]]; then
                    found_issues=true
                    echo "### :x: ${check_name} Checks Failed" >> $GITHUB_STEP_SUMMARY
                    tr -d '\r' < "$check_file" >> $GITHUB_STEP_SUMMARY
                    echo "" >> $GITHUB_STEP_SUMMARY
                else
                    echo "### :heavy_check_mark: ${check_name} Checks Passed" >> $GITHUB_STEP_SUMMARY
                    echo "" >> $GITHUB_STEP_SUMMARY
                fi
              fi
          done
          for check_file in ./*_checks.txt; do
              if [[ -f "$check_file" ]]; then
                check_name=$(basename "$check_file" _checks.txt | sed 's/.*/\u&/; s/_\(.\)/ \u\1/g')
                if [[ -s "$check_file" ]]; then
                    found_issues=true
                    echo "### :x: ${check_name} Checks Failed" >> $GITHUB_STEP_SUMMARY
                    echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
                    tr -d '\r' < "$check_file" >> $GITHUB_STEP_SUMMARY
                    echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
                    echo "" >> $GITHUB_STEP_SUMMARY
                else
                    echo "### :heavy_check_mark: ${check_name} Checks Passed" >> $GITHUB_STEP_SUMMARY
                    echo "" >> $GITHUB_STEP_SUMMARY
                fi
              fi
          done
          if [[ "$found_issues" == "false" ]]; then
              if [[ "${{ steps.run_checks.outcome }}" != "success" ]]; then
                  echo "### :x: Sanity check failed, but no specific output files were found/populated." >> $GITHUB_STEP_SUMMARY
                  echo "Check the logs for details." >> $GITHUB_STEP_SUMMARY
                  found_issues=true
              fi
          fi
          echo "issues_found=$found_issues" >> $GITHUB_OUTPUT
      - name: Fail Workflow if Checks Failed
        if: ${{ steps.run_checks.outcome == 'failure' || steps.summarize_checks.outputs.issues_found == 'true' }}
        run: |
          echo "Sanity checks failed. See summary for details."
          exit 1

  Lua_Language_server:
    name: Lua Language Server
    needs: Sanity_Checks
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/devtools:ubuntu
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global --add safe.directory $GITHUB_WORKSPACE
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Lua Language Server
        id: run_lls
        run: python ./tools/ci/lua_lang_server.py

      - name: Summarize run
        id: summarize_run
        if: ${{ always() }}
        run: |
          echo "## Lua Language Server Results" >> $GITHUB_STEP_SUMMARY
          found_issues=false
          check_file=lua_lang_errors.txt
          if [[ -f "$check_file" && -s "$check_file" ]]; then
              found_issues=true
              echo "### :x: Run Failed" >> $GITHUB_STEP_SUMMARY
              echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
              tr -d '\r' < "$check_file" >> $GITHUB_STEP_SUMMARY
              echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
          fi
          if [[ "$found_issues" == "false" ]]; then
              if [[ "${{ steps.run_lls.outcome }}" == "success" ]]; then
                  echo "### :heavy_check_mark: All checks passed." >> $GITHUB_STEP_SUMMARY
              else
                  echo "### :x: Lua Language Server had errors, but no specific output was found." >> $GITHUB_STEP_SUMMARY
                  echo "Check the logs step for details." >> $GITHUB_STEP_SUMMARY
                  found_issues=true
              fi
          fi
          echo "issues_found=$found_issues" >> $GITHUB_OUTPUT
      - name: Fail Workflow if Checks Failed
        if: ${{ steps.run_lls.outcome == 'failure' || steps.summarize_run.outputs.issues_found == 'true' }}
        run: |
          echo "Lua Language Server failed. See summary for details."
          exit 1

  # This doubles minimum completion time and floods the summary.
  # TODO: We should at least filter the output.
  # Clang_Tidy:
  #   needs: Sanity_Checks
  #   name: Clang Tidy
  #   uses: ./.github/workflows/build.yml
  #   with:
  #     os: Ubuntu
  #     build_type: Debug
  #     runner: ubuntu-24.04
  #     compiler: clang18
  #     summarize: true

  Build:
    needs: Sanity_Checks
    name: ${{ format('Build ({0})', matrix.os) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Windows
            runner: windows-2025
            compiler: msvc19
          - os: Ubuntu
            runner: ubuntu-24.04
            compiler: gcc14
          - os: macOS
            runner: macos-15
            compiler: appleClang16
    uses: ./.github/workflows/build.yml
    with:
      os: ${{ matrix.os }}
      compiler: ${{ matrix.compiler }}
      build_type: Debug
      runner: ${{ matrix.runner }}
      upload_artifact: true

  Startup_Checks_Linux:
    name: Startup Checks (Linux)
    needs: Build
    if: ${{ !cancelled() && needs.Build.result == 'success' }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/devtools:ubuntu
    defaults:
      run:
        shell: bash
    env:
      XI_NETWORK_SQL_HOST: database
      XI_NETWORK_SQL_PORT: 3306
      XI_NETWORK_SQL_DATABASE: xidb
      XI_NETWORK_SQL_LOGIN: xiadmin
      XI_NETWORK_SQL_PASSWORD: 'password'
    services:
      database:
        image: mariadb:latest
        env:
          MARIADB_DATABASE: ${{ env.XI_NETWORK_SQL_DATABASE }}
          MARIADB_USER: ${{ env.XI_NETWORK_SQL_LOGIN }}
          MARIADB_PASSWORD: ${{ env.XI_NETWORK_SQL_PASSWORD }}
          MARIADB_RANDOM_ROOT_PASSWORD: true
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=10s
          --health-retries=10
    steps:
      - run: git config --global --add safe.directory $GITHUB_WORKSPACE
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive # For navmeshes

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ format('LSB_Ubuntu_Debug_{0}', github.sha) }}
          path: .
      - run: |
          mv xi_map_tracy xi_map
          chmod +x xi_*

      - name: Install Python dependencies
        run: |
          python -m pip install -r ./tools/requirements.txt

      # TODO: only do this if script/sql modules changed.
      # - name: Enable modules
      #   run: |
      #     python <<EOF
      #     with open("modules/init.txt", "w") as f:
      #         f.write("custom\n")
      #         f.write("era\n")
      #         f.write("example\n")
      #         f.write("renamer\n")
      #     EOF

      - name: Initialize database
        id: init_db
        run: python ./tools/dbtool.py update

      - name: Run tests
        id: tests
        run: python -m tools.ci.startup_checks

      - name: Summarize checks
        id: summarize_checks
        if: ${{ always() }}
        run: |
          echo "## Startup Results" >> $GITHUB_STEP_SUMMARY
          found_issues=false
          for log_file in ./log/*.log; do
              if [[ -f "$log_file" && -s "$log_file" ]]; then
                  if grep -qi "warning\|error\|crash\|critical" "$log_file"; then
                      found_issues=true
                      log_name=$(basename "$log_file" .log | sed 's/.*/\u&/; s/-\(.\)/ \u\1/g')
                      echo "### :x: ${log_name} Checks Failed" >> $GITHUB_STEP_SUMMARY
                      echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
                      grep -i "warning\|error\|crash\|critical" "$log_file" >> $GITHUB_STEP_SUMMARY
                      echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
                      echo "" >> $GITHUB_STEP_SUMMARY
                  fi
                  # TODO: check for tests output
              fi
          done
          if [[ "$found_issues" == "false" ]]; then
              if [[ "${{ steps.tests.outcome }}" == "success" ]]; then
                  echo "### :heavy_check_mark: All checks passed." >> $GITHUB_STEP_SUMMARY
              else
                  echo "### :x: Combat check failed, but no specific errors were found." >> $GITHUB_STEP_SUMMARY
                  echo "Check the logs for details." >> $GITHUB_STEP_SUMMARY
                  found_issues=true
              fi
          fi
          for log_file in ./log/*.log; do
              if [[ -f "$log_file" && -s "$log_file" ]]; then
                  log_name=$(basename "$log_file" .log | sed 's/.*/\u&/; s/-\(.\)/ \u\1/g')
                  echo "### :sailboat: ${log_name}" >> $GITHUB_STEP_SUMMARY
                  echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
                  cat "$log_file" >> $GITHUB_STEP_SUMMARY
                  echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
              fi
          done
          echo "issues_found=$found_issues" >> $GITHUB_OUTPUT
      - name: Fail Workflow if Checks Failed
        if: ${{ steps.tests.outcome == 'failure' || steps.summarize_checks.outputs.issues_found == 'true' }}
        run: |
          echo "Startup checks failed. See summary for details."
          exit 1

  Startup_Checks_Windows:
    name: Startup Checks (Windows)
    runs-on: windows-2025
    needs: Build
    if: ${{ !cancelled() && needs.Build.result == 'success' }}
    defaults:
      run:
        shell: bash
    env:
      XI_NETWORK_SQL_HOST: 127.0.0.1
      XI_NETWORK_SQL_PORT: 3306
      XI_NETWORK_SQL_DATABASE: xidb
      XI_NETWORK_SQL_LOGIN: root
      XI_NETWORK_SQL_PASSWORD: 'root'
    steps:
      - uses: actions/setup-python@v5
        id: setup_python
        with:
          python-version: '3.12'

      - uses: zach2good/setup-mariadb@v1
        with:
          database: ${{ env.XI_NETWORK_SQL_DATABASE }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive # For navmeshes

      - uses: actions/download-artifact@v4
        with:
          name: ${{ format('LSB_Windows_Debug_{0}', github.sha) }}
          path: .
      - run: |
          mv xi_map_tracy xi_map
          chmod +x xi_*

      - name: Restore Python virtual environment
        id: python-cache
        uses: actions/cache/restore@v4
        env:
          hash: ${{ hashFiles('./tools/requirements.txt') }}
        with:
          path: .venv
          key: ${{ format('venv-Windows-{0}-{1}', env.hash, github.base_ref) }}
          restore-keys: |
            ${{ format('venv-Windows-{0}-', env.hash) }}

      - name: Install Python dependencies
        if: ${{ !steps.python-cache.outputs.cache-hit }}
        run: |
          python3 -m venv .venv
          source .venv/Scripts/activate
          python -m pip install -r ./tools/requirements.txt

      - name: Activate Python virtual environment
        run: |
          echo ".venv/Scripts" >> $GITHUB_PATH
          echo "VIRTUAL_ENV=$(pwd)/.venv" >> $GITHUB_ENV

      # TODO: only do this if src modules changed.
      # - name: Enable modules
      #   run: |
      #     python <<EOF
      #     with open("modules/init.txt", "w") as f:
      #         f.write("custom\n")
      #         f.write("era\n")
      #         f.write("example\n")
      #         f.write("renamer\n")
      #     EOF

      - name: Import SQL files
        run: python ./tools/dbtool.py update

      - name: Startup checks
        id: tests
        run: python -m tools.ci.startup_checks

      - name: Summarize checks
        id: summarize_checks
        if: ${{ always() }}
        run: |
          echo "## Startup Results" >> $GITHUB_STEP_SUMMARY
          found_issues=false
          for log_file in ./log/*.log; do
              if [[ -f "$log_file" && -s "$log_file" ]]; then
                  if grep -qi "warning\|error\|crash\|critical" "$log_file"; then
                      found_issues=true
                      log_name=$(basename "$log_file" .log | sed 's/.*/\u&/; s/-\(.\)/ \u\1/g')
                      echo "### :x: ${log_name} Tests Failed" >> $GITHUB_STEP_SUMMARY
                      echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
                      grep -i "warning\|error\|crash\|critical" "$log_file" >> $GITHUB_STEP_SUMMARY
                      echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
                      echo "" >> $GITHUB_STEP_SUMMARY
                  fi
                  # TODO: check for tests output
              fi
          done
          if [[ "$found_issues" == "false" ]]; then
              if [[ "${{ steps.tests.outcome }}" == "success" ]]; then
                  echo "### :heavy_check_mark: All tests passed." >> $GITHUB_STEP_SUMMARY
              else
                  echo "### :x: Startup tests failed, but no specific errors were found." >> $GITHUB_STEP_SUMMARY
                  echo "Check the logs for details." >> $GITHUB_STEP_SUMMARY
                  found_issues=true
              fi
          fi
          for log_file in ./log/*.log; do
              if [[ -f "$log_file" && -s "$log_file" ]]; then
                  log_name=$(basename "$log_file" .log | sed 's/.*/\u&/; s/-\(.\)/ \u\1/g')
                  echo "### :sailboat: ${log_name}" >> $GITHUB_STEP_SUMMARY
                  echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
                  cat "$log_file" >> $GITHUB_STEP_SUMMARY
                  echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
              fi
          done
          echo "issues_found=$found_issues" >> $GITHUB_OUTPUT
      - name: Fail Workflow if Checks Failed
        if: ${{ steps.tests.outcome == 'failure' || steps.summarize_checks.outputs.issues_found == 'true' }}
        run: |
          echo "Startup checks failed. See summary for details."
          exit 1
