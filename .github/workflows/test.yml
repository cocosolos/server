on:
  workflow_call:
    inputs:
      platform:
        description: 'Linux/Windows platform to test.'
        required: true
        type: string
      test_modules:
        description: 'Test with modules enabled.'
        required: false
        type: boolean
        default: false
      multi_process:
        description: 'Test with multiple map processes.'
        required: false
        type: boolean
        default: false

jobs:
  Test_Linux:
    name: ${{ format('{0}Test (Linux)', inputs.multi_process && 'Multi-Process ' || '') }}
    if: ${{ inputs.platform == 'Linux' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read         # Read repository contents
      checks: write          # Create check runs with test results
      pull-requests: write   # Post PR comments with test summaries
      actions: read          # Browse workflow runs and artifacts
      statuses: write        # Update commit statuses
    container:
      image: ghcr.io/${{ github.repository_owner }}/devtools:ubuntu
    defaults:
      run:
        shell: bash
    env:
      XI_NETWORK_SQL_HOST: database
      XI_NETWORK_SQL_PORT: 3306
      XI_NETWORK_SQL_DATABASE: xidb
      XI_NETWORK_SQL_LOGIN: xiadmin
      XI_NETWORK_SQL_PASSWORD: 'password'
    services:
      database:
        image: mariadb:lts
        env:
          MARIADB_DATABASE: ${{ env.XI_NETWORK_SQL_DATABASE }}
          MARIADB_USER: ${{ env.XI_NETWORK_SQL_LOGIN }}
          MARIADB_PASSWORD: ${{ env.XI_NETWORK_SQL_PASSWORD }}
          MARIADB_RANDOM_ROOT_PASSWORD: true
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=10s
          --health-retries=10
    steps:
      - run: git config --global --add safe.directory $GITHUB_WORKSPACE

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive # For navmeshes

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --upgrade -r ./tools/requirements.txt

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ format('LSB_Linux_Debug_{0}', github.sha) }}
          path: .

      - name: Prepare executables
        run: |
          mv xi_map_tracy xi_map 2> /dev/null || true
          chmod +x xi_*

      - name: Enable modules
        if: ${{ inputs.test_modules }}
        run: |
          python <<EOF
          with open("modules/init.txt", "w") as f:
              f.write("custom\n")
              f.write("era\n")
              f.write("example\n")
              f.write("renamer\n")
          EOF

      - name: Initialize database
        id: init_db
        run: python ./tools/dbtool.py update

      - name: Run xi_test
        run: ./xi_test --keep-going --output tests.ctrf.json

      - name: Publish Test Report
        uses: ctrf-io/github-test-reporter@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          report-path: './tests.ctrf.json'
          github-report: true
          summary: true
          pull-request: false
          status-check: true
          status-check-name: 'xi_test (Linux)'
          annotate: true
          upload-artifact: true
          artifact-name: 'xi_test-ctrf-linux'
        if: always()

      - name: Run startup checks
        id: tests
        run: python -m tools.ci.startup_checks ${{ inputs.multi_process && 'multi' || '' }}

      - name: Summarize checks
        id: summarize_checks
        if: ${{ always() }}
        run: |
          echo "## Startup Results" >> $GITHUB_STEP_SUMMARY
          found_issues=false
          for log_file in ./log/*.log; do
              if [[ -f "$log_file" && -s "$log_file" ]]; then
                  if grep -qi "warning\|error\|crash\|critical" "$log_file" | grep -v "Invalid zone requested:"; then
                      found_issues=true
                      log_name=$(basename "$log_file" .log | sed 's/.*/\u&/; s/-\(.\)/ \u\1/g')
                      echo "### :x: ${log_name} Tests Failed" >> $GITHUB_STEP_SUMMARY
                      echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
                      grep -i "warning\|error\|crash\|critical" "$log_file" | grep -v "Invalid zone requested:" >> $GITHUB_STEP_SUMMARY
                      echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
                      echo "" >> $GITHUB_STEP_SUMMARY
                  fi
              fi
          done
          if [[ "$found_issues" == "false" ]]; then
              if [[ "${{ steps.tests.outcome }}" == "success" ]]; then
                  echo "### :heavy_check_mark: All tests passed." >> $GITHUB_STEP_SUMMARY
              else
                  echo "### :x: Startup tests failed, but no specific errors were found." >> $GITHUB_STEP_SUMMARY
                  echo "Check the logs for details." >> $GITHUB_STEP_SUMMARY
                  found_issues=true
              fi
          fi
          for log_file in ./log/*.log; do
              if [[ -f "$log_file" && -s "$log_file" ]]; then
                  log_name=$(basename "$log_file" .log | sed 's/.*/\u&/; s/-\(.\)/ \u\1/g')
                  echo "### :sailboat: ${log_name}" >> $GITHUB_STEP_SUMMARY
                  echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
                  cat "$log_file" >> $GITHUB_STEP_SUMMARY
                  echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
              fi
          done
          echo "issues_found=$found_issues" >> $GITHUB_OUTPUT

      - name: Fail Workflow if Checks Failed
        if: ${{ steps.tests.outcome == 'failure' || steps.summarize_checks.outputs.issues_found == 'true' }}
        run: |
          echo "Startup checks failed. See summary for details."
          exit 1

  Test_Windows:
    name: ${{ format('{0}Test (Windows)', inputs.multi_process && 'Multi-Process ' || '') }}
    runs-on: windows-2025
    if: ${{ inputs.platform == 'Windows' }}
    permissions:
      contents: read         # Read repository contents
      checks: write          # Create check runs with test results
      pull-requests: write   # Post PR comments with test summaries
      actions: read          # Browse workflow runs and artifacts
      statuses: write        # Update commit statuses
    defaults:
      run:
        shell: bash
    env:
      XI_NETWORK_SQL_HOST: 127.0.0.1
      XI_NETWORK_SQL_PORT: 3306
      XI_NETWORK_SQL_DATABASE: xidb
      XI_NETWORK_SQL_LOGIN: root
      XI_NETWORK_SQL_PASSWORD: 'root'
    steps:
      - uses: zach2good/setup-mariadb@v1

      - uses: actions/setup-python@v5
        id: setup_python
        with:
          python-version: '3.12'

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive # For navmeshes

      - name: Install Python dependencies
        run: |
          python3 -m venv .venv
          source .venv/Scripts/activate
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --upgrade -r ./tools/requirements.txt

      - name: Activate Python virtual environment
        run: |
          echo ".venv/Scripts" >> $GITHUB_PATH
          echo "VIRTUAL_ENV=$(pwd)/.venv" >> $GITHUB_ENV

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ format('LSB_Windows_Debug_{0}', github.sha) }}
          path: .

      - name: Prepare executables
        run: |
          mv xi_map_tracy xi_map 2> /dev/null || true
          chmod +x xi_*

      - name: Enable modules
        if: ${{ inputs.test_modules }}
        run: |
          python <<EOF
          with open("modules/init.txt", "w") as f:
              f.write("custom\n")
              f.write("era\n")
              f.write("example\n")
              f.write("renamer\n")
          EOF

      - name: Import SQL files
        run: python ./tools/dbtool.py setup ${{ env.XI_NETWORK_SQL_DATABASE }}

      - name: Run xi_test
        run: ./xi_test.exe --keep-going --output tests.ctrf.json

      - name: Publish Test Report
        uses: ctrf-io/github-test-reporter@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          report-path: './tests.ctrf.json'
          github-report: true
          summary: true
          pull-request: false
          status-check: true
          status-check-name: 'xi_test (Windows)'
          annotate: true
          upload-artifact: true
          artifact-name: 'xi_test-ctrf-windows'
        if: always()

      - name: Startup checks
        id: tests
        timeout-minutes: 10
        run: python -m tools.ci.startup_checks ${{ inputs.multi_process && 'multi' || '' }}

      - name: Summarize checks
        id: summarize_checks
        if: ${{ always() }}
        run: |
          echo "## Startup Results" >> $GITHUB_STEP_SUMMARY
          found_issues=false
          for log_file in ./log/*.log; do
              if [[ -f "$log_file" && -s "$log_file" ]]; then
                  if grep -qi "warning\|error\|crash\|critical" "$log_file" | grep -v "Invalid zone requested:"; then
                      found_issues=true
                      log_name=$(basename "$log_file" .log | sed 's/.*/\u&/; s/-\(.\)/ \u\1/g')
                      echo "### :x: ${log_name} Tests Failed" >> $GITHUB_STEP_SUMMARY
                      echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
                      grep -i "warning\|error\|crash\|critical" "$log_file" | grep -v "Invalid zone requested:" >> $GITHUB_STEP_SUMMARY
                      echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
                      echo "" >> $GITHUB_STEP_SUMMARY
                  fi
              fi
          done
          if [[ "$found_issues" == "false" ]]; then
              if [[ "${{ steps.tests.outcome }}" == "success" ]]; then
                  echo "### :heavy_check_mark: All tests passed." >> $GITHUB_STEP_SUMMARY
              else
                  echo "### :x: Startup tests failed, but no specific errors were found." >> $GITHUB_STEP_SUMMARY
                  echo "Check the logs for details." >> $GITHUB_STEP_SUMMARY
                  found_issues=true
              fi
          fi
          for log_file in ./log/*.log; do
              if [[ -f "$log_file" && -s "$log_file" ]]; then
                  log_name=$(basename "$log_file" .log | sed 's/.*/\u&/; s/-\(.\)/ \u\1/g')
                  echo "### :sailboat: ${log_name}" >> $GITHUB_STEP_SUMMARY
                  echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
                  cat "$log_file" >> $GITHUB_STEP_SUMMARY
                  echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
              fi
          done
          echo "issues_found=$found_issues" >> $GITHUB_OUTPUT

      - name: Fail Workflow if Checks Failed
        if: ${{ steps.tests.outcome == 'failure' || steps.summarize_checks.outputs.issues_found == 'true' }}
        run: |
          echo "Startup checks failed. See summary for details."
          exit 1
